<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Anmol Srivastava</title>
  <meta name="description" content="This page doesn't exist on Anmol Srivastava's portfolio.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F5EFF'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='27' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F6F8; --ink: #17202A; --muted: #56616D; --line: #D6DCE3;
      --accent: #1F5EFF; --accent-ink: #FFFFFF; --accent-soft: #E3EAFF;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12171D; --ink: #E8ECF1; --muted: #9AA5B1; --line: #2A333D;
        --accent: #7C9BFF; --accent-ink: #0E1320; --accent-soft: #1C2540;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12171D; --ink: #E8ECF1; --muted: #9AA5B1; --line: #2A333D;
      --accent: #7C9BFF; --accent-ink: #0E1320; --accent-soft: #1C2540;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 17px; line-height: 1.6;
    }
    main { width: 100%; max-width: 640px; padding: 48px 16px; }
    .code {
      display: inline-block; margin: 0 0 20px; padding: 2px 10px; border-radius: 8px;
      background: var(--accent-soft); color: var(--accent); font-weight: 500;
    }
    h1 {
      font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700;
      font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 16px;
    }
    p { margin: 0 0 28px; color: var(--muted); }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; }
    a.btn {
      display: inline-block; padding: 10px 18px; border-radius: 999px; text-decoration: none; font-weight: 500;
      border: 1px solid var(--line); color: var(--ink);
    }
    a.btn:hover { border-color: var(--accent); color: var(--accent); }
    a.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    a.btn-primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old or mistyped. Everything I've built is on the homepage.</p>
    <div class="btns">
      <a class="btn btn-primary" href="/">Go to the homepage</a>
      <a class="btn" href="https://github.com/AnmolSrivastavaaaa">See my GitHub</a>
    </div>
  </main>
</body>
</html>
